<style>

.carta>div:first-child{padding-left:0;border-right:1px solid var(--rule)}
.carta>div:last-child{padding-right:0}
.sec{font-family:var(--pf);font-style:italic;font-weight:700;text-transform:uppercase;color:var(--red);font-size:clamp(30px,2.8vw,40px);text-align:center;margin:30px 0 26px;display:flex;align-items:center;justify-content:center;gap:22px}
.sec::before,.sec::after{content:"◆";font-size:12px;font-style:normal}
.item{display:grid;grid-template-columns:1fr auto;gap:8px 24px;padding:14px 0}
.item b{font-family:var(--pf);font-weight:400;color:var(--red);font-size:19px}
.item .pr{font-family:var(--pt);font-style:italic;color:var(--grey);font-size:14px;text-align:right;white-space:nowrap;padding-top:4px}
.item p{grid-column:1/-1;font-size:14px;line-height:1.5;color:#555;max-width:48ch}
.box{border:1px solid var(--red);padding:6px;margin:30px 0}
.box>div{border:1px solid var(--rule);padding:34px 30px;text-align:center}
.box .sec{margin-top:0}
.box .item{text-align:left}
.box .ill{width:min(60%,260px);margin:20px auto 0;mix-blend-mode:multiply}
.feat{display:grid;grid-template-columns:200px 1fr;gap:26px;align-items:center;text-align:left}
.feat .ill{width:100%;margin:0;mix-blend-mode:multiply}
.boxred{border:1px solid var(--red);padding:6px;margin:30px 0;background:#F3EFE6}
.boxred>div{border:1px solid var(--rule);padding:34px 30px;text-align:center}
.boxred h3{font-family:var(--pf);font-style:italic;font-weight:700;text-transform:uppercase;color:var(--red);font-size:clamp(30px,2.8vw,40px);margin-bottom:16px}
.boxred hr{width:90px;margin:0 auto 24px;border:0;border-top:1px solid var(--rule)}
.boxred .w{margin:22px 0}
.boxred .w b{display:block;font-family:var(--pf);color:var(--red);font-size:19px;font-weight:400}
.boxred .w p{font-size:14px;color:#555;line-height:1.5;max-width:40ch;margin:4px auto 0}
.boxred .w small{display:block;font-family:var(--pt);font-style:italic;color:var(--grey);font-size:13px;margin-top:6px}
.dots{border:0;border-top:4px dotted var(--rule);margin:50px 0 40px}
@media (max-width:900px){.carta{grid-template-columns:1fr}.carta>div{padding:0!important;border:0!important}.feat{grid-template-columns:120px 1fr}}
/* nosotros */
.heroimg{position:relative;border:1px solid var(--rule)}
.heroimg img{width:100%;aspect-ratio:16/9;object-fit:cover}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:34px 0 0;font-size:16px;line-height:1.65;color:#444}
.who2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:0;margin-top:40px;padding-top:40px;border-top:1px solid var(--rule)}
.who2>div:first-child{padding-right:40px;border-right:1px solid var(--rule)}
.who2>div:last-child{padding-left:40px}
.who2 h2{font-size:clamp(64px,10vw,150px);line-height:.9;margin:10px 0 24px}
.who2 .intro{font-size:17px;line-height:1.6;color:#444;max-width:60ch;margin:0 0 34px}
.team{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.team figure{border:1px solid var(--rule);padding:6px}
.team img{width:100%;aspect-ratio:4/5;object-fit:cover}
.team figcaption{padding:14px 4px 4px;font-family:var(--bt)}
.team figcaption b{display:block;font-family:var(--pf);color:var(--red);font-size:20px}
.team figcaption span{font-size:14px;color:#555;line-height:1.55;display:block;margin-top:4px}
.side .redbox h2{font-size:clamp(48px,6vw,96px)}
.facts{text-align:center;padding:30px 10px}
.facts .ill{width:min(70%,240px);margin:10px auto 26px;mix-blend-mode:multiply}
.facts p{font-size:15px;line-height:1.6;color:#555;max-width:34ch;margin:0 auto}
.facts hr{width:120px;margin:34px auto;border:0;border-top:1px solid var(--red);position:relative}
.facts hr::after{content:"◆";position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:var(--paper);color:var(--red);font-size:11px;padding:0 8px}
.philo{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;margin-top:40px;padding-top:40px;border-top:1px solid var(--rule)}
.philo .redbox h2{font-size:clamp(56px,7.4vw,118px);line-height:.9}
.philo p{font-size:16px;line-height:1.65;color:#444;max-width:46ch;margin:30px 0 0 60px}
.game{border:1px solid var(--red);padding:6px}
.game>div{border:1px solid var(--rule);padding:28px}
.game h3{font-family:var(--pf);font-weight:700;text-transform:uppercase;color:var(--red);font-size:clamp(34px,3.6vw,52px);line-height:1;margin:6px 0 12px}
.game p{font-size:14px;color:#555;line-height:1.5;margin-bottom:18px}
.grid8{display:grid;grid-template-columns:repeat(8,1fr);border:1px solid var(--rule);user-select:none}
.grid8 button{aspect-ratio:1;border:1px solid rgba(218,65,67,.25);font-family:var(--bt);font-size:clamp(14px,1.4vw,20px);color:var(--ink);background:transparent;transition:background .15s,color .15s}
.grid8 button.sel{background:rgba(218,65,67,.15)}
.grid8 button.found{background:var(--red);color:#fff}
.game .words{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.game .words span{font-family:var(--pt);font-style:italic;font-size:13px;color:var(--grey);border:1px solid var(--rule);padding:3px 10px}
.game .words span.done{text-decoration:line-through;color:var(--red)}
@media (max-width:900px){.twocol,.who2,.philo,.team{grid-template-columns:1fr}.who2>div{padding:0!important;border:0!important}.philo p{margin-left:0}}
/* cotizar */
.resv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:50px;align-items:start;padding:30px 0 20px}
.resv figure{border:1px solid var(--rule);padding:6px}
.resv img{width:100%;aspect-ratio:4/5;object-fit:cover}
.resv h1{font-size:clamp(48px,6vw,88px);line-height:.95;text-align:center;margin:30px 0 20px}
.resv .lead{font-size:16px;line-height:1.6;color:#444;text-align:center;max-width:56ch;margin:0 auto 34px}
@media (max-width:900px){.resv{grid-template-columns:1fr}}
/* galeria */
.gal{position:relative;padding:20px 0 60px}
.gal .word{position:sticky;top:30vh;text-align:center;font-size:clamp(80px,16vw,250px);line-height:.85;margin:0;pointer-events:none;z-index:0}
.gal .word span{display:block}
.gal .pics{position:relative;z-index:1;margin-top:40px}
.gal figure{border:1px solid var(--rule);padding:6px;background:var(--paper);width:min(46%,560px);margin:70px 0}
.gal figure:nth-child(odd){margin-left:0}
.gal figure:nth-child(even){margin-left:auto}
.gal figure img{width:100%;height:auto;display:block}
.gal .word .rules{position:relative}
@media (max-width:900px){.gal figure{width:80%}.gal .word{top:20vh}}
</style>
